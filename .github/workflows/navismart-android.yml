name: NaviSmart Android
on:
  push:
    branches: [navismart]
    paths: ['android/**', 'navismart/economy/**', '.github/workflows/navismart-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navismart-android-${{ github.ref }}
  cancel-in-progress: true
env:
  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
  SKIP_MAP_DOWNLOAD: true
  CCACHE_COMPILERCHECK: content
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - name: Initialize native dependencies
        run: git submodule update --init --recursive --depth 1 --jobs=8
      - name: Install CoMaps build prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build python3-venv qt6-base-dev qt6-declarative-dev qt6-positioning-dev libqt6svg6-dev optipng libfreetype-dev libharfbuzz-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev zlib1g-dev
      - name: Configure CoMaps resources
        run: ./configure.sh
      - name: Cache native compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: navismart-arm64-fdroid
          max-size: 750M
      - name: Verify economy and profiles
        working-directory: android
        run: ./gradlew --no-daemon :economy:check
      - name: Verify Android profile storage
        working-directory: android
        run: ./gradlew --no-daemon -Parm64 -PdisableHWAsan -Pnjobs=2 :app:testFdroidDebugUnitTest --tests 'app.organicmaps.navismart.*Test'
      - name: Build arm64 APK
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew --no-daemon -Parm64 -PdisableHWAsan -Pnjobs=2 :app:assembleFdroidDebug
      - name: Upload development APK
        uses: actions/upload-artifact@v6
        with:
          name: navismart-android-arm64-debug
          path: android/app/build/outputs/apk/**/NaviSmart-*.apk
          if-no-files-found: error
          retention-days: 14
