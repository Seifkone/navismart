name: NaviSmart economic engine
on:
  push:
    branches: [navismart]
    paths: ['navismart/economy/**', 'tools/navismart/**', '.github/workflows/navismart-economy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run offline acceptance scenarios
        shell: pwsh
        run: ./tools/navismart/run-economy.ps1 -Mode Test
      - name: Verify local OBD session analysis
        shell: pwsh
        run: python -m unittest discover -s tools/navismart/tests -p 'test_*.py' -v
      - name: Run configurable simulation
        shell: pwsh
        run: ./tools/navismart/run-economy.ps1 -Mode Simulate -Scenario ./navismart/economy/scenarios/two-routes.properties
      - name: Compare synthetic vehicles using saved profiles
        shell: pwsh
        run: ./tools/navismart/run-economy.ps1 -Mode Simulate -Scenario ./navismart/economy/scenarios/two-routes.properties -Profiles ./navismart/economy/scenarios/vehicle-profiles.properties -Vehicle all -At '2026-10-13T12:00:00Z'
