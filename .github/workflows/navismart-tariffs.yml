name: NaviSmart tariff data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'
permissions:
  contents: write
concurrency:
  group: navismart-tariff-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: navismart
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PDF reader
        run: python -m pip install pdfplumber==0.11.9 pyproj==3.7.2
      - name: Verify tariff conversion tests
        run: python -m unittest discover -s tools/navismart/tests -p 'test_toll_*.py' -v
      - name: Read current official operator tables
        run: python tools/navismart/refresh_toll_pack.py --output android/app/src/main/assets/navismart-tolls
      - name: Publish validated data only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/assets/navismart-tolls/APRR.csv android/app/src/main/assets/navismart-tolls/AREA.csv android/app/src/main/assets/navismart-tolls/gates.csv android/app/src/main/assets/navismart-tolls/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified operator tariff data'
            git push origin HEAD:navismart
          fi
